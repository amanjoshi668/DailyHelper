    function getTradeName(tradeId) {
      const tr = TRADES.find(x => x.id === tradeId);
      if (!tr) return tradeId;
      return state.lang === 'hi' ? tr.hi : tr.en;
    }

    function pushNotification(target, title, body) {
      if (!state.notificationsEnabled) return;
      const payload = { id: Date.now(), title, body };
      if (target === 'both') {
        state.topNotifCustomer = payload;
        state.topNotifWorker = payload;
      } else if (target === 'worker') {
        state.topNotifWorker = payload;
      } else {
        state.topNotifCustomer = payload;
      }
    }

    function dismissNotif(roleSide) {
      if (roleSide === 'worker') state.topNotifWorker = null;
      else state.topNotifCustomer = null;
      renderAll();
    }

    // --- Lightweight Hybrid AI Search ---
    function handleSearch(val) {
      state.searchQuery = val;
      const q = val.trim().toLowerCase();
      if (!q) {
        state.aiHint = null;
        state.selectedTrade = 'all';
        renderAll();
        return;
      }
      let matched = null;
      if (/(bijli|switch|spark|mcb|fan|light|inverter|wiring|electric|बिजली|स्विच|पंखा)/.test(q)) matched = 'electrician';
      else if (/(tap|nal|leak|paani|flush|pipe|sink|plumb|नल|पानी|लीक)/.test(q)) matched = 'plumber';
      else if (/(door|lock|hinge|almari|wood|bed|curtain|carpent|दरवाजा|अलमारी)/.test(q)) matched = 'carpenter';
      else if (/(ac|cooling|fridge|washing|ro|geyser|एसी)/.test(q)) matched = 'appliance';
      else if (/(paint|damp|putty|पेंट|सीलन)/.test(q)) matched = 'painter';

      if (matched) {
        state.selectedTrade = matched;
        state.bookingDraft.issueNote = val.trim();
        state.aiHint = getTradeName(matched);
      } else {
        state.aiHint = null;
      }
      renderAll();
    }

    function handleLoginSubmit(provider) {
      const isPro = state.loginAccountType === 'worker';
      const fallbackName = isPro ? 'Ramesh Kumar' : 'Priya Menon';
      const fallbackEmail = isPro ? 'ramesh@example.com' : 'priya@example.com';
      const name = (state.loginForm.name || fallbackName).trim();
      const email = (state.loginForm.email || fallbackEmail).trim();
      const initials = name.split(/\s+/).map(s => s[0]).join('').slice(0, 2).toUpperCase() || 'U';

      if (isPro) {
        state.proUser = {
          signedIn: true,
          name,
          initials,
          email,
          phone: state.loginForm.phone || '+91 99001 44556'
        };
        state.pendingBookingAfterLogin = false;
        state.workspace = 'worker';
        state.custSubPage = null;
        state.proSubPage = null;
        pushNotification('worker', 'Signed In as Professional', `Welcome back, ${name}.`);
        renderAll();
        return;
      }

      state.authUser = {
        signedIn: true,
        name,
        initials,
        email,
        phone: state.loginForm.phone || '+91 98450 11223'
      };
      state.workspace = 'customer';

      if (state.pendingBookingAfterLogin) {
        state.pendingBookingAfterLogin = false;
        createBookingRecord();
      } else {
        state.custSubPage = null;
        state.proSubPage = null;
        pushNotification('customer', 'Signed In', `Welcome back, ${name}.`);
        renderAll();

    function handleSignOut(roleSide) {

    function createBookingRecord() {
      const w = state.workers.find(x => x.id === state.bookingDraft.workerId) || state.workers[0];
      const newId = 'BK-' + (1050 + state.bookings.length);
      const pinInfo = PINS.find(p => p.pin === state.pin) || { pin: state.pin, areaEn: 'PIN ' + state.pin };
      state.bookings.unshift({
        id: newId,
        workerId: w.id,
        customerName: state.authUser.name,
        customerPhone: state.authUser.phone,
        pin: state.pin,
        locality: pinInfo.areaEn,
        fullAddress: state.bookingDraft.address || 'Flat 402, Palm Grove',
        date: state.bookingDraft.date,
        slot: state.bookingDraft.slot,
        issueNote: state.bookingDraft.issueNote || 'Inspection & repair',
        visitFee: w.visitFee,
        finalAmount: null,
        paymentMethod: null,
        status: 'requested',
        rating: null
      });
      state.custSubPage = null;
      state.custTab = 'bookings';
      state.proTab = 'jobs';
      pushNotification('customer', 'Booking Requested', `${w.nameEn} · ${state.bookingDraft.date}, ${state.bookingDraft.slot}`);
      pushNotification('worker', 'New Booking Request', `${state.authUser.name} requested ${state.bookingDraft.slot}`);
      renderAll();
    }

    function handleWorkerJobAction(bookingId, action) {
      const b = state.bookings.find(x => x.id === bookingId);
      if (!b) return;
      const w = state.workers.find(x => x.id === b.workerId) || state.workers[0];

      if (action === 'accept') {
        b.status = 'confirmed';
        pushNotification('customer', 'Booking Confirmed!', `${w.nameEn} accepted ${b.slot}. 60-min reminder scheduled.`);
        pushNotification('worker', 'Slot Confirmed', `Address unlocked: ${b.fullAddress}`);
      } else if (action === 'decline') {
        b.status = 'declined';

    // --- Deterministic Inline SVG QR ---
    function renderQrSvg(seed) {
      let h = 2166136261;
      for (let i = 0; i < seed.length; i++) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      const n = 21, c = 6;
      let rects = '';
      const finder = (r, col, r0, c0) => {
        const lr = r - r0, lc = col - c0;
        return lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
      };
      for (let r = 0; r < n; r++) {
        for (let col = 0; col < n; col++) {
          let on = false;
          if (r < 7 && col < 7) on = finder(r, col, 0, 0);
          else if (r < 7 && col >= n - 7) on = finder(r, col, 0, n - 7);
          else if (r >= n - 7 && col < 7) on = finder(r, col, n - 7, 0);
          else {
            h ^= (r * 31 + col * 17);
            h = Math.imul(h, 16777619);
            on = (Math.abs(h) % 10) < 5;
          }
          if (on) rects += `<rect x="${(col + 2) * c}" y="${(r + 2) * c}" width="${c}" height="${c}" fill="currentColor" />`;
        }
      }
      const s = (n + 4) * c;
      return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" class="mx-auto rounded-xl border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] p-2">${rects}</svg>`;
    }

                <button onclick="state.pin='${p.pin}';setSubPage('${roleSide}', null)" class="w-full p-3.5 rounded-2xl border text-left flex items-center justify-between text-xs ${state.pin === p.pin ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)] font-semibold' : 'bg-[var(--card)] border-[var(--border)]'}">
                  <span>📍 ${p.pin}</span>
                  <span>${state.lang === 'hi' ? p.areaHi : p.areaEn}</span>
                </button>
              `).join('')}
              <div class="flex gap-2 pt-2">
                <input id="pinCustomField" type="text" maxlength="6" placeholder="Enter 6-digit PIN..." class="flex-1 px-3 py-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)] text-xs focus:outline-none" />
                <button onclick="const v=document.getElementById('pinCustomField').value.trim();if(/^\\d{6}$/.test(v)){state.pin=v;setSubPage('${roleSide}', null);}" class="px-4 py-2.5 rounded-xl bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] text-xs font-semibold">Apply</button>
              </div>
            </div>
          </div>
        `;
      }

      if (page === 'upi_settle') {
        const w = state.workers[0];
        return `
          <div class="flex flex-col h-full bg-[var(--background)]">
            <div class="px-4 py-3.5 border-b border-[var(--border)] bg-[var(--card)] flex items-center justify-between">
              <button onclick="setSubPage('worker', null)" class="text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)]">← ${t('back')}</button>
              <span class="text-sm font-semibold text-[var(--foreground)]">Collect Payment</span>
              <span class="w-8"></span>
            </div>
            <div class="p-5 space-y-4 flex-1 overflow-y-auto">
              <div>
                <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">Final Agreed Amount (₹)</label>
                <input type="text" inputmode="numeric" data-focus-key="settle-amt" value="${state.settleDraft.amount}" oninput="state.settleDraft.amount=this.value.replace(/[^0-9]/g,'');renderAll()" class="w-full px-3.5 py-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)] text-base font-bold text-[var(--foreground)] focus:outline-none" />
              </div>

              <div class="grid grid-cols-2 gap-2">
                <button onclick="state.settleDraft.method='UPI';renderAll()" class="py-2 rounded-xl text-xs font-semibold border ${state.settleDraft.method === 'UPI' ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--card)] border-[var(--border)]'}">UPI QR</button>
                <button onclick="state.settleDraft.method='Cash';renderAll()" class="py-2 rounded-xl text-xs font-semibold border ${state.settleDraft.method === 'Cash' ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--card)] border-[var(--border)]'}">Cash</button>
              </div>

              ${state.settleDraft.method === 'UPI' ? `
                <div class="text-center space-y-1.5 py-2">
                  ${renderQrSvg(w.upiId + state.settleDraft.amount)}
                  <div class="text-xs font-medium text-[var(--foreground)]">${w.upiId}</div>
                  <div class="text-xs text-[var(--muted-foreground)]">Direct to your bank · 0% fee</div>
                </div>
              ` : `
                <div class="p-4 rounded-2xl bg-[var(--card)] border border-[var(--border)] text-xs text-center text-[var(--muted-foreground)]">
                  Collect ₹${state.settleDraft.amount || 0} in cash directly from the customer.
                </div>
              `}

              <button onclick="completeSettlement()" class="w-full py-3 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-sm font-semibold">
                Payment Received · Complete Job
              </button>
            </div>
          </div>
        `;
      }

      if (page === 'worker_detail') {
        return `
          <div class="flex flex-col h-full bg-[var(--background)]">
            <div class="px-4 py-3.5 border-b border-[var(--border)] bg-[var(--card)] flex items-center justify-between">
              <button onclick="setSubPage('customer', null)" class="text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)]">← ${t('back')}</button>
              <span class="text-sm font-semibold text-[var(--foreground)]">Book Appointment</span>
              <span class="w-8"></span>
            </div>
            <div class="flex-1 overflow-y-auto">
              ${renderWorkerDetailPane(state.selectedWorkerId)}
            </div>
          </div>
        `;
      }

      return '';
    }

    // --- Worker Profile & Slot Selection Pane ---
    function renderWorkerDetailPane(workerId) {
      const w = state.workers.find(x => x.id === workerId) || state.workers[0];
      const skills = state.lang === 'hi' ? w.skillsHi : w.skillsEn;
      return `
        <div class="p-4 space-y-4">
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-3">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full bg-[var(--secondary)] text-[var(--secondary-foreground)] font-bold text-sm flex items-center justify-center shrink-0">${w.initials}</div>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2">
                  <h3 class="text-base font-bold text-[var(--foreground)] truncate">${state.lang === 'hi' ? w.nameHi : w.nameEn} ${w.verified ? '✓' : ''}</h3>
                  <span class="text-xs font-semibold">★ ${w.rating}</span>
                </div>
                <p class="text-xs text-[var(--muted-foreground)]">${getTradeName(w.trade)} · ${w.exp} yrs exp · ${w.langs}</p>
              </div>
            </div>

            <div class="pt-2 border-t border-[var(--border)] flex items-center justify-between text-xs">
              <span class="text-[var(--muted-foreground)]">${t('visitFee')}: <strong class="text-[var(--foreground)]">₹${w.visitFee}</strong></span>
              <span class="text-[var(--muted-foreground)]">${t('hourlyRate')}: <strong class="text-[var(--foreground)]">₹${w.hourlyRate}/hr</strong></span>
            </div>

            <div class="flex flex-wrap gap-1.5">
              ${skills.map(s => `<span class="px-2.5 py-1 rounded-lg bg-[var(--content)] text-xs text-[var(--muted-foreground)]">${s}</span>`).join('')}
            </div>
          </div>

          <div class="space-y-2">
            <label class="block text-xs font-semibold text-[var(--foreground)]">Select Date</label>
            <div class="grid grid-cols-3 gap-2">
              ${DATES.map(d => {
                const active = state.bookingDraft.date === d.id;
                return `<button onclick="state.bookingDraft.date='${d.id}';renderAll()" class="py-2 px-2 rounded-xl text-xs font-medium border transition ${active ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--card)] border-[var(--border)]'}">${state.lang === 'hi' ? d.hi : d.en}</button>`;
              }).join('')}
            </div>
          </div>

          <div class="space-y-2">
            <label class="block text-xs font-semibold text-[var(--foreground)]">Select Time Slot</label>
            <div class="grid grid-cols-2 gap-2">
              ${SLOTS.map(s => {
                const blocked = w.blockedSlots.includes(s);
                const active = state.bookingDraft.slot === s && !blocked;
                return `<button ${blocked ? 'disabled' : `onclick="state.bookingDraft.slot='${s}';renderAll()"`} class="py-2 px-2.5 rounded-xl text-xs border transition truncate ${blocked ? 'opacity-40 line-through bg-[var(--content)] border-[var(--border)]' : active ? 'bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold border-[var(--primary)]' : 'bg-[var(--card)] border-[var(--border)]'}">${s}</button>`;
              }).join('')}
            </div>
          </div>

          <div class="space-y-2.5">
            <input type="text" data-focus-key="draft-note" value="${(state.bookingDraft.issueNote || '').replace(/"/g, '&quot;')}" oninput="state.bookingDraft.issueNote=this.value" placeholder="Short note (e.g., bedroom fan regulator)" class="w-full px-3.5 py-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)] text-xs text-[var(--foreground)] focus:outline-none" />
            <input type="text" data-focus-key="draft-addr" value="${(state.bookingDraft.address || '').replace(/"/g, '&quot;')}" oninput="state.bookingDraft.address=this.value" placeholder="House / Flat &amp; Landmark" class="w-full px-3.5 py-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)] text-xs text-[var(--foreground)] focus:outline-none" />
          </div>

          <button onclick="state.bookingDraft.workerId='${w.id}';attemptConfirmBooking()" class="w-full py-3 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-sm font-semibold shadow-sm hover:opacity-95 transition">
            ${t('confirmBooking')} · ₹${w.visitFee} ${t('visitLabel')}
          </button>
        </div>
      `;
    }

    // --- Calm Customer Main Screens ---
    function renderCustomerBody(isSplit = false) {
      if (state.custTab === 'bookings') {
        return `
          <div class="p-4 space-y-3">
            ${state.bookings.map(b => {
              const w = state.workers.find(x => x.id === b.workerId) || state.workers[0];
              const statusMap = {
                requested: 'Requested',
                confirmed: 'Confirmed',
                in_progress: 'In Progress',
                completed: 'Completed',
                declined: 'Declined'
              };
              return `
                <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="text-sm font-semibold text-[var(--foreground)] truncate">${state.lang === 'hi' ? w.nameHi : w.nameEn}</div>
                      <div class="text-xs text-[var(--muted-foreground)]">${getTradeName(w.trade)} · ${b.date}, ${b.slot}</div>
                    </div>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${b.status === 'confirmed' || b.status === 'in_progress' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)] text-[var(--secondary-foreground)]'}">${statusMap[b.status] || b.status}</span>
                  </div>

                  <div class="text-xs text-[var(--muted-foreground)]">${b.issueNote}</div>

                  <div class="pt-2 border-t border-[var(--border)] flex items-center justify-between gap-2">
                    <span class="text-xs font-medium text-[var(--foreground)]">
                      ${b.finalAmount ? `Paid ₹${b.finalAmount} (${b.paymentMethod})` : `₹${b.visitFee} ${t('visitLabel')}`}
                    </span>
                    ${(b.status === 'confirmed' || b.status === 'in_progress') ? `
                      <button onclick="pushNotification('customer', 'Calling Helper', '${w.nameEn}: ${w.phone}');renderAll()" class="px-3 py-1.5 rounded-xl bg-[var(--secondary)] text-[var(--secondary-foreground)] text-xs font-semibold">
                        📞 ${t('callBtn')}
                      </button>
                    ` : b.status === 'completed' ? `
                      <div class="flex items-center gap-0.5">
                        ${[1, 2, 3, 4, 5].map(st => `<button onclick="b=state.bookings.find(x=>x.id==='${b.id}');if(b){b.rating=${st};renderAll();}" class="text-sm px-0.5 ${(b.rating || 0) >= st ? 'text-[var(--foreground)]' : 'text-[var(--muted-foreground)] opacity-40'}">★</button>`).join('')}
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // Explore View — Calm, Clean, Zero Banner Clutter
      const workers = state.workers.filter(w => state.selectedTrade === 'all' || w.trade === state.selectedTrade);
      return `
        <div class="p-4 space-y-4">
          <!-- Clean Single Search Box -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5">
            <span class="text-xs text-[var(--muted-foreground)]">🔍</span>
            <input
              type="text"
              data-focus-key="cust-search"
              value="${state.searchQuery.replace(/"/g, '&quot;')}"
              oninput="handleSearch(this.value)"
              placeholder="${t('searchPlaceholder')}"
              class="w-full bg-transparent text-xs text-[var(--foreground)] placeholder:text-[var(--placeholder)] focus:outline-none min-w-0"
            />
            ${state.searchQuery ? `<button onclick="handleSearch('')" class="text-xs text-[var(--muted-foreground)]">✕</button>` : ''}
          </div>

          ${state.aiHint ? `
            <div class="px-1 flex items-center justify-between text-xs text-[var(--muted-foreground)]">
              <span>Showing matching <strong>${state.aiHint}</strong> helpers</span>
              <button onclick="handleSearch('')" class="underline">Reset</button>
            </div>
          ` : ''}

          <!-- Clean Category Pills -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar">
            ${TRADES.map(tr => {
              const active = state.selectedTrade === tr.id;
              return `<button onclick="state.selectedTrade='${tr.id}';renderAll()" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border transition ${active ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--card)] text-[var(--foreground)] border-[var(--border)]'}">${tr.icon}${state.lang === 'hi' ? tr.hi : tr.en}</button>`;
            }).join('')}
          </div>

          <!-- Spacious, Uncluttered Worker Cards -->
          <div class="space-y-3">
            ${workers.map(w => {
              const selected = isSplit && state.selectedWorkerId === w.id;
              return `
                <div onclick="openWorkerDetail('${w.id}')" class="cursor-pointer bg-[var(--card)] border ${selected ? 'border-[var(--primary)]' : 'border-[var(--border)]'} rounded-2xl p-4 hover:opacity-95 transition">
                  <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0 flex-1">
                      <div class="w-11 h-11 rounded-full bg-[var(--secondary)] text-[var(--secondary-foreground)] font-semibold text-xs flex items-center justify-center shrink-0">
                        ${w.initials}
                      </div>
                      <div class="min-w-0 flex-1">
                        <div class="text-sm font-semibold text-[var(--foreground)] truncate">
                          ${state.lang === 'hi' ? w.nameHi : w.nameEn} ${w.verified ? '<span class="text-xs font-normal text-[var(--muted-foreground)]">✓</span>' : ''}
                        </div>
                        <div class="text-xs text-[var(--muted-foreground)] truncate mt-0.5">
                          ${getTradeName(w.trade)} · ${w.exp} yrs
                        </div>
                      </div>
                    </div>
                    <div class="text-xs font-semibold text-[var(--foreground)] shrink-0">★ ${w.rating}</div>
                  </div>

                  <div class="mt-3.5 pt-3 border-t border-[var(--border)] flex items-center justify-between gap-2">
                    <div class="text-xs text-[var(--muted-foreground)]">
                      <strong class="text-sm font-bold text-[var(--foreground)]">₹${w.visitFee}</strong> ${t('visitLabel')} · ₹${w.hourlyRate}/hr
                    </div>
                    <span class="px-3.5 py-1.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold">
                      ${t('bookBtn')}
                    </span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // --- Calm Professional Workspace Screens ---
    function renderWorkerBody() {
      const ramesh = state.workers[0];
      if (state.proTab === 'khata') {
        return renderWorkerRatesAndKhata(ramesh);
      }

      const myJobs = state.bookings.filter(b => b.workerId === 'w1');
      const requests = myJobs.filter(b => b.status === 'requested');
      const schedule = myJobs.filter(b => b.status === 'confirmed' || b.status === 'in_progress');

      return `
        <div class="p-4 space-y-4">
          <!-- Clean Availability Toggle -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-semibold text-[var(--foreground)]">${state.lang === 'hi' ? ramesh.nameHi : ramesh.nameEn}</div>
              <div class="text-xs text-[var(--muted-foreground)]">${t('availableToggle')}</div>
            </div>
            <button onclick="state.workers[0].isOnline=!state.workers[0].isOnline;renderAll()" class="px-3.5 py-1.5 rounded-full text-xs font-semibold border transition ${ramesh.isOnline ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--content)] text-[var(--muted-foreground)] border-[var(--border)]'}">
              ${ramesh.isOnline ? 'Online' : 'Paused'}
            </button>
          </div>

          <!-- New Requests -->
          <div class="space-y-2.5">
            <h3 class="px-1 text-xs font-semibold text-[var(--muted-foreground)]">${t('newRequests')} (${requests.length})</h3>
            ${requests.length === 0 ? `
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 text-xs text-[var(--muted-foreground)]">
                No pending requests right now.
              </div>
            ` : requests.map(b => `
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-semibold text-[var(--foreground)]">${b.date} · ${b.slot}</span>
                  <span class="text-xs font-semibold text-[var(--muted-foreground)]">₹${b.visitFee} ${t('visitLabel')}</span>
                </div>
                <div class="text-xs text-[var(--muted-foreground)] space-y-0.5">
                  <div class="text-[var(--foreground)] font-medium">${b.locality} (${b.pin})</div>
                  <div>${b.issueNote}</div>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                  <button onclick="handleWorkerJobAction('${b.id}', 'accept')" class="py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold">${t('acceptBtn')}</button>
                  <button onclick="handleWorkerJobAction('${b.id}', 'decline')" class="py-2 rounded-xl bg-[var(--content)] text-[var(--muted-foreground)] border border-[var(--border)] text-xs font-medium">${t('declineBtn')}</button>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Upcoming Schedule -->
          <div class="space-y-2.5">
            <h3 class="px-1 text-xs font-semibold text-[var(--muted-foreground)]">${t('upcomingJobs')} (${schedule.length})</h3>
            ${schedule.length === 0 ? `
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 text-xs text-[var(--muted-foreground)]">
                Confirmed bookings appear here.
              </div>
            ` : schedule.map(b => `
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-sm font-semibold text-[var(--foreground)]">${b.customerName}</span>
                  <span class="text-xs text-[var(--muted-foreground)]">${b.slot}</span>
                </div>
                <div class="text-xs text-[var(--muted-foreground)]">${b.fullAddress}</div>
                <div class="flex gap-2 pt-1">
                  <button onclick="pushNotification('worker', 'Calling Customer', '${b.customerName}: ${b.customerPhone}');renderAll()" class="px-3.5 py-2 rounded-xl bg-[var(--secondary)] text-[var(--secondary-foreground)] text-xs font-semibold">📞 ${t('callBtn')}</button>
                  ${b.status === 'confirmed' ? `
                    <button onclick="handleWorkerJobAction('${b.id}', 'start')" class="flex-1 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold">${t('startWorkBtn')}</button>
                  ` : `
                    <button onclick="handleWorkerJobAction('${b.id}', 'settle')" class="flex-1 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold">${t('completeBtn')}</button>
                  `}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderWorkerRatesAndKhata(ramesh) {
      // Note: Export Khata is strictly inside Settings -> More Options, NOT here!
      return `
        <div class="p-4 space-y-4">
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-semibold text-[var(--muted-foreground)]">${t('khataSummary')}</h3>
            <div class="grid grid-cols-3 gap-2">
              <div class="p-2.5 rounded-xl bg-[var(--content)]">
                <div class="text-xs text-[var(--muted-foreground)]">${t('today')}</div>
                <div class="text-base font-bold text-[var(--foreground)] mt-0.5">₹${ramesh.khataToday}</div>
              </div>
              <div class="p-2.5 rounded-xl bg-[var(--content)]">
                <div class="text-xs text-[var(--muted-foreground)]">${t('thisMonth')}</div>
                <div class="text-base font-bold text-[var(--foreground)] mt-0.5">₹${ramesh.khataMonth}</div>
              </div>
              <div class="p-2.5 rounded-xl bg-[var(--content)]">
                <div class="text-xs text-[var(--muted-foreground)]">${t('completed')}</div>
                <div class="text-base font-bold text-[var(--foreground)] mt-0.5">${ramesh.jobsCount}</div>
              </div>
            </div>
          </div>

          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-semibold text-[var(--muted-foreground)]">${t('myRates')}</h3>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-[var(--muted-foreground)] mb-1">${t('visitFee')} (₹)</label>
                <input type="text" inputmode="numeric" data-focus-key="rate-visit" value="${ramesh.visitFee}" oninput="const n=parseInt(this.value,10);if(!isNaN(n)){state.workers[0].visitFee=n;}" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-sm font-semibold text-[var(--foreground)] focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs text-[var(--muted-foreground)] mb-1">${t('hourlyRate')} (₹)</label>
                <input type="text" inputmode="numeric" data-focus-key="rate-hr" value="${ramesh.hourlyRate}" oninput="const n=parseInt(this.value,10);if(!isNaN(n)){state.workers[0].hourlyRate=n;}" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-sm font-semibold text-[var(--foreground)] focus:outline-none" />
              </div>
            </div>
            <div>
              <label class="block text-xs text-[var(--muted-foreground)] mb-1.5">Available Time Slots</label>
              <div class="grid grid-cols-2 gap-2">
                ${SLOTS.map(s => {
                  const blocked = ramesh.blockedSlots.includes(s);
                  return `<button onclick="const arr=state.workers[0].blockedSlots;const i=arr.indexOf('${s}');if(i>=0)arr.splice(i,1);else arr.push('${s}');renderAll()" class="py-1.5 px-2 rounded-xl text-xs border truncate ${blocked ? 'opacity-45 line-through bg-[var(--content)] border-[var(--border)]' : 'bg-[var(--secondary)] text-[var(--secondary-foreground)] border-[var(--border)] font-medium'}">${s}</button>`;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- Phone Shell (Clean Header: Location + User Icon ONLY) ---
    function renderPhoneShell(roleSide, caption) {
      const subPage = getSubPage(roleSide);
      const pendingReqCount = state.bookings.filter(b => b.workerId === 'w1' && b.status === 'requested').length;

      return `
        <div class="flex flex-col items-center">
          ${caption ? `<div class="mb-2 text-xs font-medium text-[var(--muted-foreground)]">${caption}</div>` : ''}
          <div class="phone-frame relative bg-[var(--background)] border border-[var(--border)] rounded-[32px] shadow-md overflow-hidden flex flex-col">
            ${renderTopNotification(roleSide)}

            ${subPage ? renderSubPageContent(roleSide, subPage) : `
              <!-- Clean, Uncluttered App Header: Brand/PIN on left, User Icon on right -->
              <div class="bg-[var(--card)] border-b border-[var(--border)] px-4 py-3.5 flex items-center justify-between gap-3 shrink-0">
                <div class="min-w-0">
                  <div class="text-base font-bold text-[var(--foreground)] leading-tight">${t('appName')}</div>
                  <button onclick="setSubPage('${roleSide}', 'pin_select')" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] mt-0.5 flex items-center gap-1">
                    <span>📍 ${state.pin}</span>
                    <span>▾</span>
                  </button>
                </div>
                ${renderUserAvatarButton(roleSide)}
              </div>

              <!-- Main Body -->
              <div class="flex-1 overflow-y-auto overflow-x-hidden">
                ${roleSide === 'customer' ? renderCustomerBody(false) : renderWorkerBody()}
              </div>

              <!-- Simple 2-Item Bottom Bar -->
              <div class="bg-[var(--card)] border-t border-[var(--border)] grid grid-cols-2 px-3 py-2 gap-2 shrink-0">
                ${roleSide === 'customer' ? `
                  <button onclick="state.custTab='explore';renderAll()" class="py-2 rounded-xl text-xs font-semibold transition ${state.custTab === 'explore' ? 'bg-[var(--secondary)] text-[var(--foreground)]' : 'text-[var(--muted-foreground)]'}">
                    ${t('exploreTab')}
                  </button>
                  <button onclick="state.custTab='bookings';renderAll()" class="py-2 rounded-xl text-xs font-semibold transition ${state.custTab === 'bookings' ? 'bg-[var(--secondary)] text-[var(--foreground)]' : 'text-[var(--muted-foreground)]'}">
                    ${t('bookingsTab')} (${state.bookings.length})
                  </button>
                ` : `
                  <button onclick="state.proTab='jobs';renderAll()" class="py-2 rounded-xl text-xs font-semibold transition ${state.proTab === 'jobs' ? 'bg-[var(--secondary)] text-[var(--foreground)]' : 'text-[var(--muted-foreground)]'}">
                    ${t('jobsTab')}${pendingReqCount ? ` (${pendingReqCount})` : ''}
                  </button>
                  <button onclick="state.proTab='khata';renderAll()" class="py-2 rounded-xl text-xs font-semibold transition ${state.proTab === 'khata' ? 'bg-[var(--secondary)] text-[var(--foreground)]' : 'text-[var(--muted-foreground)]'}">
                    ${t('khataTab')}
                  </button>
                `}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // --- Clean Responsive Web / Tablet View ---
    function renderWebSplitView() {
      const roleSide = state.workspace;
      const subPage = getSubPage(roleSide);
      return `
        <div class="w-full bg-[var(--card)] border border-[var(--border)] rounded-3xl shadow-md overflow-hidden relative min-h-[680px] flex flex-col">
          ${renderTopNotification(roleSide)}

          ${subPage ? `<div class="max-w-md w-full mx-auto flex-1 py-4">${renderSubPageContent(roleSide, subPage)}</div>` : `
            <div class="px-6 py-4 border-b border-[var(--border)] flex items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <span class="text-base font-bold text-[var(--foreground)]">${t('appName')}</span>
                <button onclick="setSubPage('${roleSide}', 'pin_select')" class="px-3 py-1 rounded-full bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--muted-foreground)]">📍 ${state.pin} ▾</button>
              </div>
              <div class="flex items-center gap-3">
                ${roleSide === 'customer' ? `
                  <button onclick="state.custTab='explore';renderAll()" class="px-3 py-1.5 rounded-xl text-xs font-semibold ${state.custTab === 'explore' ? 'bg-[var(--secondary)] text-[var(--foreground)]' : 'text-[var(--muted-foreground)]'}">${t('exploreTab')}</button>
                  <button onclick="state.custTab='bookings';renderAll()" class="px-3 py-1.5 rounded-xl text-xs font-semibold ${state.custTab === 'bookings' ? 'bg-[var(--secondary)] text-[var(--foreground)]' : 'text-[var(--muted-foreground)]'}">${t('bookingsTab')} (${state.bookings.length})</button>
                ` : ''}
                ${renderUserAvatarButton(roleSide)}
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 flex-1">
              <div class="md:col-span-7 border-r border-[var(--border)] bg-[var(--background)] max-h-[620px] overflow-y-auto">
                ${roleSide === 'customer' ? renderCustomerBody(true) : (() => { const p = state.proTab; state.proTab = 'jobs'; const h = renderWorkerBody(); state.proTab = p; return h; })()}
              </div>
              <div class="md:col-span-5 bg-[var(--background)] max-h-[620px] overflow-y-auto">
                ${roleSide === 'customer' ? renderWorkerDetailPane(state.selectedWorkerId) : renderWorkerRatesAndKhata(state.workers[0])}
              </div>
            </div>
          `}
        </div>
      `;
    }

    function renderAll() {
      const activeEl = document.activeElement;
      const focusKey = activeEl && activeEl.dataset ? activeEl.dataset.focusKey : null;
      const selPos = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;

      const vpBar = document.getElementById('viewportSwitcher');
      const modes = [
        { id: 'mobile', label: 'Mobile' },
        { id: 'dual', label: 'Dual Live Sync' },
        { id: 'tablet', label: 'Web / Tablet' }
      ];
      vpBar.innerHTML = modes.map(m => `
        <button onclick="state.viewport='${m.id}';renderAll()" class="px-3 py-1 rounded-lg text-xs font-medium transition ${state.viewport === m.id ? 'bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">
          ${m.label}
        </button>
      `).join('');

      const roleBar = document.getElementById('rolePreviewSwitcher');
      if (state.viewport === 'dual') {
        roleBar.classList.add('hidden');
      } else {
        roleBar.classList.remove('hidden');
        roleBar.innerHTML = [
          { id: 'customer', label: 'Customer Account' },
          { id: 'worker', label: 'Professional Account' }
        ].map(r => `
          <button onclick="state.workspace='${r.id}';state.custSubPage=null;state.proSubPage=null;renderAll()" class="px-3 py-1 rounded-lg text-xs font-medium transition ${state.workspace === r.id ? 'bg-[var(--secondary)] text-[var(--foreground)] font-semibold' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">
            ${r.label}
          </button>
        `).join('');
      }

      const stage = document.getElementById('stageContainer');
      if (state.viewport === 'mobile') {
        stage.innerHTML = renderPhoneShell(state.workspace, '');
      } else if (state.viewport === 'dual') {
        stage.innerHTML =
          renderPhoneShell('customer', 'Customer View') +
          renderPhoneShell('worker', 'Professional View');
      } else {
        stage.innerHTML = renderWebSplitView();
      }

      if (focusKey) {
        const nextEl = document.querySelector(`[data-focus-key="${focusKey}"]`);
        if (nextEl) {
          nextEl.focus();
          if (selPos !== null && typeof nextEl.setSelectionRange === 'function') {
            try { nextEl.setSelectionRange(selPos, selPos); } catch (_) {}
          }
        }
      }
    }

    renderAll();
  </script>
</body>
</html>
